}
if(APP.mode==='startup'){
 const r=m.raw;if(/客戶|需求|痛點|市場|訪談|驗證|CPO|產品/.test(q))return `AI 模擬客戶：以「${r.ind}」為例，我們重視服務是否易於導入、價格是否透明、是否能真正節省成本。請提供至少兩個可實測假設，並以試點或訪談驗證。本組的模擬證據等級為 ${r.evidence}/5。`;
 if(/CAC|LTV|資金|現金|跑道|燒錢|CFO|財務|成本|月費/.test(q))return `AI 財務分析：第十二個月獲客成本 CAC 約新臺幣 ${money(r.cac)} 元，客戶終身價值 LTV 約 ${money(r.ltv)} 元。${Number.isFinite(r.runway)?`依第十二月單月淨現金流出估算，資金跑道約 ${num(r.runway)} 個月。`:'第十二月模擬現金流非負，無法以淨流出計算有限跑道。'}模型已註明留存與成長假設。`;
 if(/36|三年|營收|獲利|成長|收入|訂閱/.test(q))return `AI 財務預測：目前所選「${r.ind}」，第十二月營收約 ${num(r.month12/10000)} 萬元，第三十六月營收約 ${num(r.month36/10000)} 萬元，三年累計營收約 ${num(r.revenue36/10000,0)} 萬元。此為規則引擎的教學假設。`;
 if(/投資|募資|股權|pitch|簡報|風險|問題|質詢/i.test(q))return `AI 投資委員會質詢：請回答三個問題。第一，為什麼客戶要付費？第二，你的 LTV 與 CAC 比值是否能維持？第三，如果競爭對手降價 20%，你的競爭優勢是什麼？請用證據而非口號回答。`;
 return `歡迎來到創業投資委員會。你的產業是「${r.ind}」，種子資金為三百萬元。請說明客戶痛點、營收模式，以及如何驗證市場。`;
}
const r=m.raw;if(/工廠|交期|交貨|瓶頸|COO|廠長|產能/.test(q))return `AI 廠長報告：本情境三座工廠準時交貨率基準約為北區 81.9%、中區 85.4%、南區 77.4%。目前整體模擬準交率 ${pct(r.otd)}。建議先處理南區排程與關鍵原料短缺，再評估全廠需求預測。`;
if(/投資|預算|ROI|成本|回收|CFO|財務|資金/.test(q))return `AI 財務長回報：董事會轉型額度兩千萬元，已配置 ${num(r.invest)} 百萬元，剩餘 ${num(r.remaining)} 百萬元。${r.roi===null?'目前尚未進行投資，因此 ROI 暫無法計算。':`以二十四個月模擬歸因淨效益估算，投資 ROI 為 ${pct(r.roi)}。`}務必比較效益歸因、持續成本與替代投資。`;
if(/原料|庫存|供應商|缺料|交期|採購/.test(q)){const a=DATA.scenario3.materials.filter(x=>x['現有庫存']<x['安全庫存']);return `AI 供應鏈顧問：目前有 ${a.length} 項原料低於安全庫存，包括 ${a.slice(0,4).map(x=>x['品名']).join('、')}。請確認主要供應商與可替代料源，避免單點失效。`}
if(/資安|攻擊|系統|網路|CIO|資訊|異常/.test(q))return 'AI 資安顧問：如果物流系統受攻擊，先隔離受影響系統並啟動人工備援流程，再確認備份及日誌的完整性。資安事件應由學員提出影響範圍、復原順序與責任分工。';
return `AI 轉型顧問：目前整體準時交貨率 ${pct(r.otd)}，庫存週轉 ${num(r.inventoryTurn)} 次，剩餘預算 ${num(r.remaining)} 百萬元。建議結合資料品質、流程改造與組織培訓。`;
}
function resolveSpokenChoice(text){const s=session();if(s.round===0)return false;const options=scene().choices[s.round-1];const low=text.toLowerCase();let ix=-1;for(let i=0;i<options.length;i++){const c=options[i];if(low.includes(c.title.toLowerCase())||low.includes(c.id.toLowerCase())){ix=i;break}}
 if(ix<0&&/^(採用|選擇|決定|我選|我們選|我要選|我選擇)/.test(text)){if(/第一|選項a|方案a|一號|a方案/i.test(text))ix=0;else if(/第二|選項b|方案b|二號|b方案/i.test(text))ix=1;else if(/第三|選項c|方案c|三號|c方案/i.test(text))ix=2}
 if(ix>=0){choiceAction(options[ix].id,true);return true}return false}
function handleUtterance(input,viaSpeech=false){const text=input.trim();if(!text)return;const cn=scene();let role=cn.roles[APP.roleIndex]||cn.roles[0];const roleMatch=cn.roles.findIndex((r,i)=>i>0&&((r.match(/^[A-Z]+/i)||[])[0]||'___').length>1&&new RegExp(`(?:我是|擔任|扮演|由)\\s*${r.match(/^[A-Z]+/i)[0]}`,'i').test(text));if(roleMatch>0){APP.roleIndex=roleMatch;role=cn.roles[APP.roleIndex]}
 log(`${role}${viaSpeech?'｜語音':''}`,text,'user');
 if(APP.roleIndex===0&&/重設|清空|重新開始/.test(text)){resetSession();return}
 if(APP.roleIndex===0&&/開始|啟動|第一輪/.test(text)&&(!session().round||/重新|啟動/.test(text))){startRound();return}
 if(APP.roleIndex===0&&/下一輪|進入第二輪|進入第三輪|結束情境|結束課程/.test(text)){nextRound();return}
 if(resolveSpokenChoice(text))return;
 const reply=resolveResponse(text);answer(reply);
}
function startMic(){if(APP.listening){try{APP.listeningObj?.stop()}catch(e){}APP.listening=false;render();return}const Rec=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Rec){alert('目前瀏覽器未提供 Web Speech 語音辨識。建議使用支援語音辨識的 Chrome/Edge，允許麥克風權限；也可以先點選示範語音問題操作。');return}try{const rec=new Rec();rec.lang='zh-TW';rec.continuous=false;rec.interimResults=false;rec.maxAlternatives=1;APP.listeningObj=rec;rec.onresult=e=>{const txt=e.results[e.results.length-1][0].transcript;APP.listening=false;handleUtterance(txt,true)};rec.onerror=e=>{APP.listening=false;render();alert(`語音辨識未能完成（${e.error}）。請確認瀏覽器權限、麥克風及語音辨識服務。`)};rec.onend=()=>{APP.listening=false;const btn=document.querySelector('[data-action=mic]');if(btn){btn.textContent='🎙　開始語音提問';btn.classList.remove('listening')}};window.speechSynthesis?.cancel();rec.start();APP.listening=true;render()}catch(e){alert('無法啟用麥克風：'+e.message)}}
function download(filename,content,mime='text/plain;charset=utf-8'){const blob=new Blob([content],{type:mime});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800)}
function csvContent(rows){if(!rows.length)return '';const keys=Object.keys(rows[0]);const cell=v=>`"${String(v??'').replace(/"/g,'""')}"`;return '\uFEFF'+keys.map(cell).join(',')+'\r\n'+rows.map(r=>keys.map(k=>cell(r[k])).join(',')).join('\r\n')}
function exportData(){const what=APP.mode;let rows,filename;if(what==='startup'){rows=DATA.scenario2.monthly_projection;filename='情境二_36個月創業試算.csv'}else if(what==='digital'){rows=DATA.scenario3.factories;filename='情境三_三工廠KPI.csv'}else{rows=DATA.scenario1.financials;filename='情境一_12個月財務.csv'}download(filename,csvContent(rows),'text/csv;charset=utf-8')}
function exportReport(){const s=session(),m=metrics(),cn=scene();const result={專案:'AI CEO Innovation Lab 演示版',情境:effectiveSceneTitle(),組別:APP.mode==='admission'?'招生訪客':APP.group,模擬回合:s.round,決策:cn.choices.map((a,i)=>a.find(o=>o.id===s.choices[i])?.title||'尚未選擇'),關鍵指標:m.cards,計算數值:m.raw,教師評分權重:cn.weights,教師各項分數:s.score,加權總分:rubricDraft(s),教師是否核定:s.confirmed,對話與事件:s.logs,資料聲明:'全部資料與 AI 回應均為演示規則模擬。'};download(`AI_CEO_Lab_${APP.mode}_${APP.group}_成果報告.json`,JSON.stringify(result,null,2),'application/json;charset=utf-8')}
function finishExperience(){const s=session();if(s.round===0)return;s.round=3;s.finished=true;APP.tab='results';log('招生體驗｜系統','參訪者完成 AI CEO 決策體驗，可提供個人化模擬決策報告。','action');save();render();speak('恭喜完成 AI CEO 企業危機模擬體驗。現在可以檢視決策成果與策略建議。')}
function runAction(action,value){const s=session();switch(action){case 'nav':APP.mode=value;APP.tab='overview';APP.roleIndex=0;APP.aiRoleIndex=0;render();break;case 'tab':APP.tab=['overview','data','results'].includes(value)?value:'overview';render();break;case 'start':startRound();break;case 'next':nextRound();break;case 'reset':resetSession();break;case 'choice':choiceAction(value);break;case 'prompt':handleUtterance(scene().prompts[Number(value)]||'',false);break;case 'mic':startMic();break;case 'toggleVoice':APP.voiceEnabled=!APP.voiceEnabled;if(!APP.voiceEnabled)window.speechSynthesis?.cancel();render();break;case 'stopVoice':window.speechSynthesis?.cancel();APP.speaking=false;render();break;case 'typed':{const val=$('fallbackInput')?.value||'';handleUtterance(val,false);break}case 'downloadAll':download('AI_CEO_Innovation_Lab_全部模擬資料.json',JSON.stringify(DATA,null,2),'application/json;charset=utf-8');break;case 'downloadData':exportData();break;case 'exportReport':exportReport();break;case 'print':window.print();break;case 'toggleFull':if(document.fullscreenElement){document.exitFullscreen?.()}else{document.documentElement.requestFullscreen?.().catch(()=>alert('此瀏覽器不支援全螢幕或未允許。'))}break;case 'confirmScore':if(APP.roleIndex!==0){alert('僅教師可以核定成績。');return} s.confirmed=true;log('教師｜評分確認',`本組分數已人工確認：${num(rubricDraft(s),1)} 分。`,'action');save();render();break;case 'finish':finishExperience();break;}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;runAction(b.dataset.action,b.dataset.value||'')});
document.addEventListener('change',e=>{const t=e.target,act=t.dataset.change;if(!act)return;if(act==='group'){APP.group=t.value;APP.roleIndex=0;APP.aiRoleIndex=0}else if(act==='role')APP.roleIndex=Number(t.value);else if(act==='airole')APP.aiRoleIndex=Number(t.value);else if(act==='industry'){session().industryIndex=Number(t.value);log('教師｜資料設定',`創業市場切換為「${DATA.scenario2.industries[session().industryIndex]['產業']}」`,'action');save()}render()});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.score===undefined)return;const i=Number(t.dataset.score);if(APP.roleIndex!==0)return;session().score[i]=Number(t.value);session().confirmed=false;const sp=document.querySelector(`.score-val-${i}`);if(sp)sp.textContent=t.value;const so=$('overallScore');if(so)so.textContent=num(rubricDraft(session()),1);save()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='fallbackInput'){e.preventDefault();handleUtterance(e.target.value,false)}});
setInterval(()=>{if(!admission())return;const e=$('admissionClock'),s=session();if(!e)return;const remain=s.startedAt?Math.max(0,30*60*1000-(Date.now()-s.startedAt)):30*60*1000;e.textContent=`${String(Math.floor(remain/60000)).padStart(2,'0')}:${String(Math.floor(remain%60000/1000)).padStart(2,'0')}`},1000);
render();
</script></body></html>
